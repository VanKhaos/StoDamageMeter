name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggered when a tag like v2.0.1 is pushed

jobs:
  create-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper versioning
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Backend
      run: |
        cd backend
        python build_backend.py
    
    - name: Build Frontend
      run: |
        cd frontend
        dotnet build -c Release
    
    - name: Build Launcher
      run: |
        cd Launcher
        dotnet build -c Release
    
    - name: Create Release Package
      run: |
        # Use your existing PowerShell script
        .\scripts\create_release.ps1 -Version "${{ github.ref_name }}"
        .\scripts\create_release_zip.ps1 -Version "${{ github.ref_name }}"
    
    - name: Extract version from tag
      id: version
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
    
    - name: Get Changelog
      id: changelog
      run: |
        $changelogPath = "CHANGELOG.md"
        $version = "${{ steps.version.outputs.version }}"
        $content = Get-Content $changelogPath -Raw
        
        # Extrahiere Changelog-Eintrag für die Version
        $pattern = "## \[$version\] - [^\r\n]+\r?\n(.*?)(?=\r?\n## \[|\z)"
        if ($content -match $pattern) {
            $changelog = $matches[1].Trim()
        } else {
            $changelog = "Bugfixes und Verbesserungen"
        }
        
        # Escape für GitHub
        $changelog = $changelog -replace '"', '\"'
        $changelog = $changelog -replace "`n", '\n'
        
        echo "changelog=$changelog" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ steps.version.outputs.version }} - Window-Binding-System Verbesserungen
        body: |
          ## 🚀 Window-Binding-System Verbesserungen
          
          ${{ steps.changelog.outputs.changelog }}
          
          ### Installation
          1. ZIP entpacken
          2. StoDamageMeter.exe starten
          3. Combat-Log auswählen
          
          ### Systemanforderungen
          - Windows 10/11 64-bit
          - Keine zusätzliche Installation erforderlich
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Releases/StoDamageMeter_${{ steps.version.outputs.version }}.zip
        asset_name: StoDamageMeter_${{ steps.version.outputs.version }}.zip
        asset_content_type: application/zip
